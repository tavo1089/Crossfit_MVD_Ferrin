{% extends "gimnasio/base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card bg-dark text-light shadow-lg mx-auto" style="max-width: 400px;">
  <div class="card-body">
    <h3 class="card-title mb-3">Iniciar sesión</h3>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label">Usuario</label>
        <input type="text" name="username" id="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" name="password" id="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary">Ingresar</button>
      <a href="{% url 'signup' %}" class="btn btn-link text-info">¿No tienes cuenta? Regístrate</a>
    </form>
  </div>
</div>
{% endblock %}
