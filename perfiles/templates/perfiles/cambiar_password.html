{% extends "gimnasio/base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="card bg-dark text-light shadow-lg mx-auto" style="max-width: 400px; margin-top: 40px;">
  <div class="card-body">
    <h3 class="card-title mb-3">Cambiar contraseña</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-3">
        <label for="id_old_password" class="form-label">Contraseña actual</label>
        {{ form.old_password }}
      </div>
      <div class="mb-3">
        <label for="id_new_password1" class="form-label">Nueva contraseña</label>
        {{ form.new_password1 }}
      </div>
      <div class="mb-3">
        <label for="id_new_password2" class="form-label">Confirmar nueva contraseña</label>
        {{ form.new_password2 }}
      </div>
      <button type="submit" class="btn btn-primary">Guardar</button>
      <a href="{% url 'mi_perfil' %}" class="btn btn-secondary ms-2">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
